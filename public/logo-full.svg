      stroke-linejoin="round"
    />
    <path
      d="M50 22 C 70 36 70 64 50 80 C 30 64 30 36 50 22 Z"
      fill="url(#upaf-leaf)"
    />
    <path
      d="M50 28 C 50 40 50 60 50 74"
      stroke="rgba(255,255,255,0.55)"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="130" y="80" font-size="52" font-weight="700" fill="#1e3a8a" letter-spacing="-1">
      <tspan>Upa</tspan><tspan fill="#0d9488">Health</tspan>
    </text>
    <text x="132" y="108" font-size="14" font-weight="500" fill="#0d9488" letter-spacing="3">
      YOUR PATH TO WELLNESS
    </text>
  </g>
